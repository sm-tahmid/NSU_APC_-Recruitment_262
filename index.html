<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Registration Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none !important; }
        .spinner { border: 4px solid rgba(0,0,0,0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: #3b82f6; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 font-sans">

    <div class="max-w-4xl mx-auto pt-12 pb-6 px-4">
        <div class="flex justify-between items-center bg-white p-4 rounded-lg shadow-sm mb-6">
            <h1 class="text-2xl font-bold text-blue-600">Registration Portal</h1>
            <div class="space-x-4">
                <button onclick="switchTab('member')" id="btn-member" class="font-semibold text-blue-600 border-b-2 border-blue-600 pb-1">Member View</button>
                <button onclick="switchTab('admin')" id="btn-admin" class="font-semibold text-gray-500 pb-1">Admin Panel</button>
            </div>
        </div>

        <div id="member-panel" class="bg-white p-8 rounded-lg shadow-md transition-all">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">Check Your Registration Status</h2>
            <div class="flex space-x-2">
                <input type="text" id="member-search-id" placeholder="Enter Serial Number" class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="searchDatabase('member')" class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 transition">Search</button>
            </div>
            <div id="member-loading" class="hidden flex justify-center mt-6"><div class="spinner"></div></div>
            <div id="member-result" class="hidden mt-6 bg-gray-50 p-4 border border-gray-200 rounded-md">
                </div>
        </div>

        <div id="admin-panel" class="hidden bg-white p-8 rounded-lg shadow-md transition-all border-t-4 border-indigo-600">
            <div id="admin-login">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">Admin Authentication required</h2>
                <input type="password" id="admin-password" placeholder="Enter Admin Password (demo: admin123)" class="w-full px-4 py-2 border rounded-md mb-4">
                <button onclick="verifyAdmin()" class="bg-indigo-600 text-white px-6 py-2 rounded-md hover:bg-indigo-700 w-full">Access Panel</button>
            </div>

            <div id="admin-interface" class="hidden">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">Admin Control Center</h2>
                <div class="flex space-x-2">
                    <input type="text" id="admin-search-id" placeholder="Enter Applicant Serial Number" class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button onclick="searchDatabase('admin')" class="bg-indigo-600 text-white px-6 py-2 rounded-md hover:bg-indigo-700 transition">Lookup</button>
                </div>
                
                <div id="admin-loading" class="hidden flex justify-center mt-6"><div class="spinner border-left-color: #4f46e5;"></div></div>
                
                <div id="admin-result" class="hidden mt-6 bg-gray-50 p-4 border border-gray-200 rounded-md">
                    <div id="admin-data-container" class="mb-4"></div>
                    <hr class="my-4">
                    <h3 class="font-semibold text-gray-700 mb-2">Evaluation Actions</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">Interviewed By (Name)</label>
                            <input type="text" id="interviewer-name" placeholder="Admin/Interviewer Name" class="w-full px-4 py-2 border rounded-md">
                        </div>
                        <div class="flex items-end space-x-2">
                            <button onclick="updateStatus('Accepted')" class="bg-green-500 text-white px-4 py-2 rounded-md hover:bg-green-600 w-full font-bold">Accept</button>
                            <button onclick="updateStatus('Declined')" class="bg-red-500 text-white px-4 py-2 rounded-md hover:bg-red-600 w-full font-bold">Decline</button>
                        </div>
                    </div>
                    <div id="admin-action-message" class="mt-3 text-sm font-semibold hidden"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION: REPLACE THIS URL WITH YOURS
        // ==========================================
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxMYXcpB_RS7wuvLbViqPOhl9yVgS-b5aSi-V2kKvkIA-Mfr5J8Tgc-dstYwvPdM2KF/exec";
        
        let currentSearchedSerial = null;

        function switchTab(tab) {
            document.getElementById('member-panel').classList.add('hidden');
            document.getElementById('admin-panel').classList.add('hidden');
            document.getElementById('btn-member').className = "font-semibold text-gray-500 pb-1";
            document.getElementById('btn-admin').className = "font-semibold text-gray-500 pb-1";

            if (tab === 'member') {
                document.getElementById('member-panel').classList.remove('hidden');
                document.getElementById('btn-member').className = "font-semibold text-blue-600 border-b-2 border-blue-600 pb-1";
            } else {
                document.getElementById('admin-panel').classList.remove('hidden');
                document.getElementById('btn-admin').className = "font-semibold text-indigo-600 border-b-2 border-indigo-600 pb-1";
            }
        }

        function verifyAdmin() {
            const pass = document.getElementById('admin-password').value;
            // Basic UI lock. Change the string below for your preferred internal team password.
            if (pass === "12345") { 
                document.getElementById('admin-login').classList.add('hidden');
                document.getElementById('admin-interface').classList.remove('hidden');
            } else {
                alert("Incorrect authorization key.");
            }
        }

        async function searchDatabase(role) {
            const inputId = role === 'member' ? 'member-search-id' : 'admin-search-id';
            const loadingId = role === 'member' ? 'member-loading' : 'admin-loading';
            const resultId = role === 'member' ? 'member-result' : 'admin-result';
            
            const serial = document.getElementById(inputId).value.trim();
            if(!serial) return alert("Please enter a valid Serial Number.");

            currentSearchedSerial = serial; // Save for admin actions

            // UI Reset
            document.getElementById(resultId).classList.add('hidden');
            document.getElementById(loadingId).classList.remove('hidden');
            if(role === 'admin') {
                document.getElementById('admin-action-message').classList.add('hidden');
                document.getElementById('interviewer-name').value = ''; 
            }

            try {
                const response = await fetch(`${APPS_SCRIPT_URL}?serial=${encodeURIComponent(serial)}`);
                const data = await response.json();
                
                document.getElementById(loadingId).classList.add('hidden');

                if (data.error) {
                    document.getElementById(resultId).innerHTML = `<p class="text-red-500 font-semibold">${data.error}</p>`;
                    document.getElementById(resultId).classList.remove('hidden');
                } else {
                    displayData(data, role, resultId);
                }
            } catch (error) {
                document.getElementById(loadingId).classList.add('hidden');
                alert("Connection error. Ensure your Apps Script Web App URL is correct and deployed securely.");
            }
        }

        function displayData(data, role, resultId) {
            let html = `<div class="grid grid-cols-2 gap-y-2 text-sm md:text-base">`;
            
            const fieldsToDisplay = ['Name', 'Department', 'ID Number', 'Phone Number', 'Status', 'Interviewed By'];
            
            fieldsToDisplay.forEach(field => {
                let value = data[field] || '<span class="text-gray-400 italic">Pending/Empty</span>';
                
                // Color code status if present
                if(field === 'Status') {
                    if(data[field] === 'Accepted') value = `<span class="text-green-600 font-bold">${data[field]}</span>`;
                    else if (data[field] === 'Declined') value = `<span class="text-red-600 font-bold">${data[field]}</span>`;
                }

                html += `<div class="font-semibold text-gray-600">${field}:</div><div>${value}</div>`;
            });
            html += `</div>`;

            if (role === 'member') {
                document.getElementById(resultId).innerHTML = html;
            } else if (role === 'admin') {
                document.getElementById('admin-data-container').innerHTML = html;
            }
            document.getElementById(resultId).classList.remove('hidden');
        }

        async function updateStatus(status) {
            const interviewer = document.getElementById('interviewer-name').value.trim();
            if(!interviewer) return alert("Please enter the Interviewer's name before updating status.");
            
            const btnContainer = document.getElementById('admin-action-message');
            btnContainer.classList.remove('hidden', 'text-green-600', 'text-red-600');
            btnContainer.classList.add('text-blue-600');
            btnContainer.innerText = "Updating database...";

            const payload = {
                action: 'updateStatus',
                serial: currentSearchedSerial,
                status: status,
                interviewer: interviewer
            };

            try {
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' } // 'text/plain' bypasses difficult CORS setups
                });
                const result = await response.json();
                
                if(result.success) {
                    btnContainer.classList.remove('text-blue-600');
                    btnContainer.classList.add('text-green-600');
                    btnContainer.innerText = `Success: Marked as ${status}.`;
                    // Refresh data on screen
                    searchDatabase('admin');
                } else {
                    btnContainer.classList.add('text-red-600');
                    btnContainer.innerText = "Error: " + result.error;
                }
            } catch (error) {
                btnContainer.classList.add('text-red-600');
                btnContainer.innerText = "Connection error. Could not update database.";
            }
        }
    </script>
</body>
</html>
