<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSAPC Registration Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none !important; }
        .spinner { border: 3px solid rgba(255,255,255,0.3); width: 24px; height: 24px; border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; }
        .spinner-blue { border-color: rgba(37, 99, 235, 0.2); border-top-color: #2563eb; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">

    <header class="bg-white shadow-md border-b-4 border-blue-600 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <img src="logo.png" alt="NSAPC Logo" class="h-10 w-auto object-contain" onerror="this.style.display='none'">
                <h1 class="text-xl md:text-2xl font-bold text-gray-800 tracking-tight">NSAPC <span class="text-blue-600">Portal</span></h1>
            </div>
        </div>
        
        <nav class="max-w-5xl mx-auto px-2 flex overflow-x-auto text-sm md:text-base font-semibold hide-scrollbar bg-gray-50">
            <button onclick="switchTab('home')" id="tab-home" class="flex-1 py-3 px-4 text-blue-700 border-b-2 border-blue-600 whitespace-nowrap">Home</button>
            <button onclick="switchTab('register')" id="tab-register" class="flex-1 py-3 px-4 text-gray-500 hover:text-blue-600 whitespace-nowrap">Register</button>
            <button onclick="switchTab('admin')" id="tab-admin" class="flex-1 py-3 px-4 text-gray-500 hover:text-red-600 whitespace-nowrap">Admin</button>
        </nav>
    </header>

    <main class="max-w-5xl mx-auto p-4 mt-4">
        
        <div id="panel-home" class="space-y-6 transition-all duration-300">
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                <div class="bg-white p-4 rounded-xl shadow border-l-4 border-blue-500">
                    <p class="text-xs text-gray-500 uppercase font-bold">Total Registered</p>
                    <h2 class="text-2xl font-black text-blue-600 mt-1" id="stat-total">--</h2>
                </div>
                <div class="bg-white p-4 rounded-xl shadow border-l-4 border-green-500">
                    <p class="text-xs text-gray-500 uppercase font-bold">Interviewed</p>
                    <h2 class="text-2xl font-black text-green-600 mt-1" id="stat-interviewed">--</h2>
                </div>
                <div class="col-span-2 md:col-span-1 bg-white p-4 rounded-xl shadow border-l-4 border-red-500">
                    <p class="text-xs text-gray-500 uppercase font-bold">Interview Date</p>
                    <h2 class="text-lg font-bold text-gray-800 mt-1" id="stat-date">Loading...</h2>
                </div>
            </div>

            <div class="bg-white p-5 md:p-8 rounded-xl shadow">
                <h3 class="text-lg font-bold mb-4 text-gray-700">Check Registration Details</h3>
                <div class="flex flex-col sm:flex-row gap-3">
                    <input type="text" id="home-search-id" placeholder="Enter Serial Number" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button onclick="searchDatabase('home')" class="bg-blue-600 text-white font-bold px-6 py-3 rounded-lg hover:bg-blue-700 flex justify-center items-center">
                        <span id="home-btn-text">Search</span>
                        <div id="home-loading" class="hidden spinner ml-2"></div>
                    </button>
                </div>
                <div id="home-result" class="hidden mt-6 bg-blue-50 p-4 border border-blue-100 rounded-lg"></div>
            </div>
        </div>

        <div id="panel-register" class="hidden bg-white p-5 md:p-8 rounded-xl shadow transition-all duration-300 border-t-4 border-green-500">
            <h2 class="text-xl font-bold mb-6 text-gray-700">New Applicant Registration</h2>
            <form id="reg-form" onsubmit="submitRegistration(event)" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><label class="block text-sm font-semibold text-gray-600 mb-1">Serial Number *</label><input type="text" id="reg-serial" required class="w-full px-4 py-2 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-green-500"></div>
                    <div><label class="block text-sm font-semibold text-gray-600 mb-1">Full Name *</label><input type="text" id="reg-name" required class="w-full px-4 py-2 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-green-500"></div>
                    <div><label class="block text-sm font-semibold text-gray-600 mb-1">ID Number *</label><input type="text" id="reg-id" required class="w-full px-4 py-2 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-green-500"></div>
                    <div><label class="block text-sm font-semibold text-gray-600 mb-1">Department *</label><input type="text" id="reg-dept" required class="w-full px-4 py-2 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-green-500"></div>
                    <div><label class="block text-sm font-semibold text-gray-600 mb-1">Phone Number *</label><input type="tel" id="reg-phone" required class="w-full px-4 py-2 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-green-500"></div>
                    <div><label class="block text-sm font-semibold text-gray-600 mb-1">Email *</label><input type="email" id="reg-email" required class="w-full px-4 py-2 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-green-500"></div>
                </div>
                
                <div><label class="block text-sm font-semibold text-gray-600 mb-1">Address *</label><input type="text" id="reg-address" required class="w-full px-4 py-2 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-green-500"></div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Suggested Department *</label>
                    <select id="reg-suggested" required class="w-full px-4 py-2 bg-gray-50 border rounded-lg focus:ring-2 focus:ring-green-500 text-gray-700">
                        <option value="">Select a preference...</option>
                        <option value="Photography">Photography</option>
                        <option value="Videography">Videography</option>
                        <option value="Corporate">Corporate</option>
                        <option value="Logistics">Logistics</option>
                        <option value="Art">Art</option>
                    </select>
                </div>

                <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 flex justify-center items-center mt-4">
                    <span id="reg-btn-text">Submit Registration</span>
                    <div id="reg-loading" class="hidden spinner ml-2"></div>
                </button>
                <div id="reg-message" class="text-center font-bold text-sm hidden mt-2"></div>
            </form>
        </div>

        <div id="panel-admin" class="hidden bg-white p-5 md:p-8 rounded-xl shadow transition-all duration-300 border-t-4 border-red-600">
            <div id="admin-login" class="max-w-sm mx-auto text-center py-6">
                <h2 class="text-xl font-bold mb-4 text-gray-700">Admin Authentication</h2>
                <input type="password" id="admin-pass" placeholder="Enter PIN (admin123)" class="w-full px-4 py-3 bg-gray-50 border rounded-lg mb-4 text-center tracking-widest">
                <button onclick="verifyAdmin()" class="bg-red-600 text-white font-bold px-6 py-3 rounded-lg hover:bg-red-700 w-full">Unlock Panel</button>
            </div>

            <div id="admin-workspace" class="hidden">
                <h2 class="text-xl font-bold mb-4 text-red-600">Applicant Evaluation</h2>
                <div class="flex flex-col sm:flex-row gap-3">
                    <input type="text" id="admin-search-id" placeholder="Applicant Serial Number" class="w-full px-4 py-3 bg-gray-50 border rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500">
                    <button onclick="searchDatabase('admin')" class="bg-red-600 text-white font-bold px-6 py-3 rounded-lg hover:bg-red-700 flex justify-center items-center">
                        <span id="admin-btn-text">Lookup</span>
                        <div id="admin-loading" class="hidden spinner ml-2"></div>
                    </button>
                </div>
                
                <div id="admin-result" class="hidden mt-6">
                    <div id="admin-data-container" class="bg-gray-50 p-4 border rounded-lg mb-6 text-sm md:text-base"></div>
                    
                    <div class="bg-red-50 p-4 border border-red-100 rounded-lg space-y-4">
                        <h3 class="font-bold text-red-800">Evaluation Notes</h3>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Interviewed By</label>
                            <input type="text" id="admin-interviewer" placeholder="Name of Evaluator" class="w-full px-4 py-2 border rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Notes / Remarks</label>
                            <textarea id="admin-notes" rows="2" placeholder="Overall performance..." class="w-full px-4 py-2 border rounded-lg"></textarea>
                        </div>
                        <div class="flex gap-3 pt-2">
                            <button onclick="submitEvaluation('Accepted')" class="flex-1 bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700">Accept</button>
                            <button onclick="submitEvaluation('Declined')" class="flex-1 bg-gray-800 text-white font-bold py-3 rounded-lg hover:bg-gray-900">Decline</button>
                        </div>
                        <div id="admin-action-msg" class="text-center font-bold text-sm hidden mt-2"></div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script>
        // ==========================================
        // REPLACE URL WITH YOUR NEW APPS SCRIPT URL
        // ==========================================
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxMYXcpB_RS7wuvLbViqPOhl9yVgS-b5aSi-V2kKvkIA-Mfr5J8Tgc-dstYwvPdM2KF/exec";
        
        let currentAdminSerial = null;

        // Fetch Dashboard Stats on Load
        window.onload = async () => {
            try {
                const res = await fetch(`${APPS_SCRIPT_URL}?action=stats`);
                const data = await res.json();
                document.getElementById('stat-total').innerText = data.totalRegistered;
                document.getElementById('stat-interviewed').innerText = data.totalInterviewed;
                document.getElementById('stat-date').innerText = data.interviewDate;
            } catch (err) {
                console.log("Stats fetch error:", err);
            }
        };

        function switchTab(tab) {
            ['home', 'register', 'admin'].forEach(t => {
                document.getElementById(`panel-${t}`).classList.add('hidden');
                let btn = document.getElementById(`tab-${t}`);
                btn.className = "flex-1 py-3 px-4 text-gray-500 hover:text-blue-600 whitespace-nowrap";
            });

            document.getElementById(`panel-${tab}`).classList.remove('hidden');
            let activeBtn = document.getElementById(`tab-${tab}`);
            
            if (tab === 'home') activeBtn.className = "flex-1 py-3 px-4 text-blue-700 border-b-2 border-blue-600 whitespace-nowrap";
            if (tab === 'register') activeBtn.className = "flex-1 py-3 px-4 text-green-700 border-b-2 border-green-500 whitespace-nowrap";
            if (tab === 'admin') activeBtn.className = "flex-1 py-3 px-4 text-red-700 border-b-2 border-red-600 whitespace-nowrap";
        }

        function verifyAdmin() {
            if (document.getElementById('admin-pass').value === "admin123") {
                document.getElementById('admin-login').classList.add('hidden');
                document.getElementById('admin-workspace').classList.remove('hidden');
            } else { alert("Incorrect PIN."); }
        }

        async function searchDatabase(role) {
            const inputId = role === 'home' ? 'home-search-id' : 'admin-search-id';
            const serial = document.getElementById(inputId).value.trim();
            if(!serial) return alert("Please enter a Serial Number.");

            const btnText = document.getElementById(`${role}-btn-text`);
            const loader = document.getElementById(`${role}-loading`);
            const resultBox = document.getElementById(`${role}-result`);

            btnText.classList.add('hidden');
            loader.classList.remove('hidden');
            resultBox.classList.add('hidden');

            if(role === 'admin') currentAdminSerial = serial;

            try {
                const response = await fetch(`${APPS_SCRIPT_URL}?serial=${encodeURIComponent(serial)}`);
                const data = await response.json();
                
                btnText.classList.remove('hidden');
                loader.classList.add('hidden');

                if (data.error) {
                    resultBox.innerHTML = `<p class="text-red-500 font-bold text-center">${data.error}</p>`;
                    resultBox.classList.remove('hidden');
                } else {
                    displayData(data, role, resultBox);
                }
            } catch (error) {
                btnText.classList.remove('hidden');
                loader.classList.add('hidden');
                alert("Connection error.");
            }
        }

        function displayData(data, role, resultBox) {
            let html = `<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">`;
            
            // Filter fields for public home view
            const fields = role === 'home' 
                ? ['Name', 'ID Number', 'Department', 'Suggested Department']
                : ['Name', 'ID Number', 'Department', 'Phone Number', 'Email', 'Address', 'Suggested Department', 'Status', 'Notes'];

            fields.forEach(field => {
                let val = data[field] || '<span class="text-gray-400">N/A</span>';
                if(field === 'Status') {
                    if(val === 'Accepted') val = `<span class="text-green-600 font-bold bg-green-100 px-2 py-1 rounded">ACCEPTED</span>`;
                    else if (val === 'Declined') val = `<span class="text-red-600 font-bold bg-red-100 px-2 py-1 rounded">DECLINED</span>`;
                }
                html += `<div><span class="block text-xs font-bold text-gray-500 uppercase">${field}</span><span class="font-medium text-gray-800">${val}</span></div>`;
            });
            html += `</div>`;

            if (role === 'home') resultBox.innerHTML = html;
            else {
                document.getElementById('admin-data-container').innerHTML = html;
                document.getElementById('admin-interviewer').value = data['Interviewed By'] || '';
                document.getElementById('admin-notes').value = data['Notes'] || '';
            }
            resultBox.classList.remove('hidden');
        }

        async function submitRegistration(e) {
            e.preventDefault();
            const btnText = document.getElementById('reg-btn-text');
            const loader = document.getElementById('reg-loading');
            const msgBox = document.getElementById('reg-message');

            btnText.classList.add('hidden');
            loader.classList.remove('hidden');
            msgBox.classList.add('hidden');

            const payload = {
                action: 'register',
                serial: document.getElementById('reg-serial').value,
                name: document.getElementById('reg-name').value,
                id: document.getElementById('reg-id').value,
                department: document.getElementById('reg-dept').value,
                phone: document.getElementById('reg-phone').value,
                email: document.getElementById('reg-email').value,
                address: document.getElementById('reg-address').value,
                suggestedDept: document.getElementById('reg-suggested').value
            };

            try {
                const res = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const result = await res.json();
                
                btnText.classList.remove('hidden');
                loader.classList.add('hidden');
                
                msgBox.innerText = result.success ? "Successfully Registered!" : result.error;
                msgBox.className = result.success ? "text-center font-bold text-sm mt-3 text-green-600" : "text-center font-bold text-sm mt-3 text-red-600";
                msgBox.classList.remove('hidden');

                if(result.success) document.getElementById('reg-form').reset();
                
            } catch (err) {
                btnText.classList.remove('hidden');
                loader.classList.add('hidden');
                msgBox.innerText = "Error connecting to database.";
                msgBox.className = "text-center font-bold text-sm mt-3 text-red-600";
                msgBox.classList.remove('hidden');
            }
        }

        async function submitEvaluation(status) {
            const interviewer = document.getElementById('admin-interviewer').value.trim();
            const notes = document.getElementById('admin-notes').value.trim();
            
            if(!interviewer) return alert("Interviewer name is required.");

            const msgBox = document.getElementById('admin-action-msg');
            msgBox.innerText = "Saving to database...";
            msgBox.className = "text-center font-bold text-sm mt-3 text-blue-600";
            msgBox.classList.remove('hidden');

            const payload = {
                action: 'updateStatus',
                serial: currentAdminSerial,
                status: status,
                interviewer: interviewer,
                notes: notes
            };

            try {
                const res = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const result = await res.json();
                
                msgBox.innerText = result.success ? `Marked as ${status}.` : result.error;
                msgBox.className = result.success ? "text-center font-bold text-sm mt-3 text-green-600" : "text-center font-bold text-sm mt-3 text-red-600";
                
                if(result.success) searchDatabase('admin'); // Refresh panel

            } catch (err) {
                msgBox.innerText = "Failed to communicate with database.";
                msgBox.className = "text-center font-bold text-sm mt-3 text-red-600";
            }
        }
    </script>
</body>
</html>
